[project]
name = "tp3-quality-gate"
version = "0.1.0"
description = "TP3 — régler sur la validation, juger sur le test scellé (porte PASS/FAIL, NLU)"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.9.1",
    "transformers[torch]>=4.57.3",
    "peft>=0.18.0",
    "datasets>=4.4.1",
    "accelerate>=1.12.0",
    "pydantic-settings>=2.0.0",
    "mlflow>=3.7.0",
    "boto3>=1.41.0",  # client S3 : le script dépose les artefacts dans RustFS
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
